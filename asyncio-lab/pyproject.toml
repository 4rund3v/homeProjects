[project]
name = "asyncio-lab"
version = "0.1.0"
description = "Learning-first asyncio: I/O-bound vs CPU-bound, a dup-find tool, and the delivery layer."
requires-python = ">=3.11"   # TaskGroup + to_thread ergonomics
# stdlib-only on purpose: the concurrency you measure is pure asyncio + process pools,
# not a library hiding the work. (See docs/05 for the optional faster-I/O note.)
dependencies = []

[project.scripts]
dupfind = "app.dupfind.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "internal"]
